<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Union Bautista Boliviana</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            color: #333;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        header {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 20px;
            text-align: center;
            animation: fadeIn 1.5s ease-in-out;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header img {
            height: 50px; /* Ajusta el tamaño del logo aquí */
            margin-right: 15px;
        }
        header h1 {
            margin: 0;
            font-size: 1.8em;
        }
        .login-button {
            background-color: #2980b9;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 1.2em;
            border-radius: 5px;
            cursor: pointer;
        }
        .login-button:hover {
            background-color: #3498db;
        }
        nav {
            background-color: #34495e;
            animation: slideIn 1.5s ease-in-out;
        }
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            text-align: center;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
        nav ul li {
            margin: 10px;
        }
        nav ul li a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.2em;
        }
        .hamburger-menu {
            display: none;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        .hamburger-menu div {
            width: 25px;
            height: 3px;
            background-color: #ffffff;
            margin: 4px 0;
        }
        .hero {
            background-image: url('https://via.placeholder.com/1200x500'); /* URL de la imagen de fondo */
            background-size: cover;
            background-position: center;
            color: #ffffff;
            text-align: center;
            padding: 100px 20px;
            animation: zoomIn 2s ease-in-out;
        }
        .hero h2 {
            font-size: 2em;
            margin: 0;
        }
        .content {
            padding: 20px;
            text-align: center;
            animation: fadeInUp 1.5s ease-in-out;
        }
        .content h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        .content p {
            font-size: 1.2em;
            line-height: 1.6;
        }
        .mission-vision {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .box {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 45%;
            margin: 10px;
            text-align: left;
        }
        .box h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        .box p {
            font-size: 1em;
            margin-bottom: 10px;
        }
        .download-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #2980b9;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.2em;
        }
        .download-button:hover {
            background-color: #3498db;
        }
        .carousel {
            position: relative;
            max-width: 1000px;
            margin: 20px auto;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .carousel img {
            width: 100%;
            display: none;
        }
        .carousel img.active {
            display: block;
        }
        .carousel-controls {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
        }
        .carousel-controls button {
            background-color: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            padding: 10px;
            cursor: pointer;
        }
        .contact-box {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 20px auto;
        }
        .contact-box h3 {
            margin: 0;
            font-size: 1.8em;
            margin-bottom: 10px;
        }
        .contact-box p {
            font-size: 1.2em;
            margin: 5px 0;
        }
        footer {
            background-color: #2c3e50;
            color: #ffffff;
            text-align: center;
            padding: 20px 0;
            animation: fadeIn 1.5s ease-in-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes zoomIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        @keyframes fadeInUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
            }
            header img {
                margin-right: 0;
                margin-bottom: 10px;
            }
            header h1 {
                font-size: 1.5em;
            }
            .login-button {
                width: 100%;
                text-align: center;
                padding: 10px 0;
            }
            .hamburger-menu {
                display: flex;
            }
            nav ul {
                flex-direction: column;
                display: none;
            }
            nav ul.open {
                display: flex;
            }
            nav ul li {
                margin: 10px 0;
            }
            .hero {
                padding: 50px 20px;
            }
            .news-item {
                max-width: 90%;
                margin: 10px;
            }
            .carousel {
                max-width: 100%;
                border-radius: 0;
            }
            .contact-box {
                max-width: 90%;
            }
            .mission-vision {
                flex-direction: column;
            }
            .box {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="URL_DEL_LOGO" alt="Logo de la Union Bautista Boliviana">
        <h1>Union Bautista Boliviana</h1>
        <button class="login-button">Inicio de Sesión</button>
        <div class="hamburger-menu" onclick="toggleMenu()">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </header>
    <nav>
        <ul>
            <li><a href="#home">Inicio</a></li>
            <li><a href="#about">Quienes Somos</a></li>
            <li><a href="#gallery">Galería</a></li>
            <li><a href="#contact">Contacto</a></li>
            <li><a href="#news">Noticias</a></li
